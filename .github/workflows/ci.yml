name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # From AWS's public mirror of Docker's official images: Docker Hub rate-limits GitHub's runners.
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Server tests, plus the contract suite against the server in this repository: once with the
      # in-memory store, once with Postgres.
      - name: Test with the in-memory store
        run: pnpm test
        env:
          TRIAGENT_CONTRACT_TARGET: v1
      # A throwaway database needn't survive a crash, so skip the disk flushes that slow down creating
      # each test's schema.
      - name: Prepare the test database
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U postgres
          -c "alter system set fsync = off" -c "alter system set synchronous_commit = off"
          -c "alter system set full_page_writes = off" -c "select pg_reload_conf()"
      - name: Test with Postgres
        run: pnpm test
        env:
          TRIAGENT_CONTRACT_TARGET: v1
          TRIAGENT_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: pnpm test:web
      - run: pnpm --filter @triagent/web exec playwright install --with-deps chromium
      # End-to-end: the real server serving the build, with axe and CSP checks.
      - run: pnpm --filter @triagent/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Both images build (each runs its own start-up checks), so a file missing from an image fails here
      # rather than at deployment. Nothing is pushed.
      # The Dockerfile's own Node image, from AWS's public mirror: Docker Hub rate-limits GitHub's runners.
      - run: echo "NODE_IMAGE=public.ecr.aws/docker/library/$(sed -n 's/^ARG NODE_IMAGE=//p' Dockerfile)" >> "$GITHUB_ENV"
      - run: docker build --build-arg NODE_IMAGE="$NODE_IMAGE" --target server -t triagent-server:ci .
      - run: docker build --build-arg NODE_IMAGE="$NODE_IMAGE" --target runner -t triagent-runner:ci .
      - name: The images start
        run: |
          docker run --rm --entrypoint sh triagent-runner:ci -c 'git --version && ocr version'
          docker run -d --name server-ci -e PUBLIC_ORIGIN=http://localhost -e COOKIE_SECURE=false -e NODE_ENV=development triagent-server:ci
          for i in $(seq 1 30); do docker exec server-ci wget -qO- http://127.0.0.1:8080/healthz && break; sleep 1; done
          docker exec server-ci wget -qO- http://127.0.0.1:8080/healthz | grep -q '"ok"'
          docker exec server-ci wget -qO- http://127.0.0.1:8080/api/v1/skill.md | grep -q '^name: triagent$'
          docker rm -f server-ci

  overlap:
    # For the moments a deploy overlaps, the version being replaced runs on the new version's schema. So a
    # migration must leave it working: add first, remove in a later release. Checked by running the base
    # branch's server tests against this branch's migrations, whenever a pull request changes them.
    name: Previous release on the new schema
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did the migrations change?
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE" HEAD -- apps/server/db/migrations; then
            echo "The migrations are the base branch's: nothing to check."
          elif ! git show "$BASE:apps/server/src/db/migrate.ts" | grep -q TRIAGENT_MIGRATIONS_DIR; then
            echo "The base branch is from before its tests could be pointed at other migrations: nothing to check this once."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the base branch beside this one
        if: steps.changed.outputs.run == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git worktree add ../previous "$BASE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changed.outputs.run == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 24
      - name: The base branch's server tests, on this branch's schema
        if: steps.changed.outputs.run == 'true'
        working-directory: ../previous
        env:
          TRIAGENT_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
        run: |
          export TRIAGENT_MIGRATIONS_DIR="$GITHUB_WORKSPACE/apps/server/db/migrations"
          pnpm install --frozen-lockfile
          # Not the tests of the migrations themselves: those are about the base branch's own files.
          node --test --test-reporter=spec $(ls apps/server/test/*.test.ts | grep -v 'migration')

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks binary, checksum-verified, rather than its action: the action needs pull-request
      # access to read a PR's commits, and the binary scans the checked-out history with no extra access.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner --verbose .
